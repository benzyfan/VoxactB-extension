hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - method=ACT_BC_LANG
    - rlbench.task_name=2025_05_30_15_14_bimanual_transfer_item_temp0
    - rlbench.tasks=[bimanual_transfer_item]
    - rlbench.demo_path=/project2/seita_1561/data/val/
    - rlbench.camera_resolution=[128,128]
    - rlbench.cameras=[wrist_right,wrist_left,front]
    - rlbench.episode_length=400
    - rlbench.gripper_mode=BimanualGripperJointPosition
    - rlbench.arm_action_mode=BimanualJointPosition
    - rlbench.action_mode=BimanualJointPositionActionMode
    - framework.logdir=/project2/seita_1561/temp
    - framework.eval_episodes=25
    - framework.eval_type=missing
    - framework.start_seed=0
  job:
    name: eval
    chdir: null
    override_dirname: framework.eval_episodes=25,framework.eval_type=missing,framework.logdir=/project2/seita_1561/temp,framework.start_seed=0,method=ACT_BC_LANG,rlbench.action_mode=BimanualJointPositionActionMode,rlbench.arm_action_mode=BimanualJointPosition,rlbench.camera_resolution=[128,128],rlbench.cameras=[wrist_right,wrist_left,front],rlbench.demo_path=/project2/seita_1561/data/val/,rlbench.episode_length=400,rlbench.gripper_mode=BimanualGripperJointPosition,rlbench.task_name=2025_05_30_15_14_bimanual_transfer_item_temp0,rlbench.tasks=[bimanual_transfer_item]
    id: ???
    num: ???
    config_name: eval
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /home1/hanwenfa/voxactb_extension/peract2
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home1/hanwenfa/voxactb_extension/peract2/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home1/hanwenfa/voxactb_extension/peract2/outputs/2025-05-30/16-31-03
    choices:
      method: ACT_BC_LANG
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
